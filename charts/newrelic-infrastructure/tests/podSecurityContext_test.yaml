suite: test pod securityContext fsGroup
templates:
  - templates/controlplane/daemonset.yaml
  - templates/controlplane/scraper-configmap.yaml
  - templates/controlplane/agent-configmap.yaml
  - templates/kubelet/daemonset.yaml
  - templates/kubelet/daemonset-windows.yaml
  - templates/kubelet/scraper-configmap.yaml
  - templates/kubelet/agent-configmap.yaml
  - templates/kubelet/integrations-configmap.yaml
  - templates/ksm/deployment.yaml
  - templates/ksm/scraper-configmap.yaml
  - templates/ksm/agent-configmap.yaml
  - templates/agent-configmap.yaml
  - templates/secret.yaml
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: fsGroup defaults to 1000 on every Linux workload
    set:
      licenseKey: test
      cluster: test
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
        template: templates/controlplane/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
        template: templates/kubelet/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
        template: templates/ksm/deployment.yaml

  - it: fsGroup defaults to 1000 when unprivileged
    set:
      licenseKey: test
      cluster: test
      privileged: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        template: templates/controlplane/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        template: templates/kubelet/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        template: templates/ksm/deployment.yaml

  - it: fsGroup default is not applied to Windows workloads
    set:
      licenseKey: test
      cluster: test
      enableWindows: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
        documentIndex: 0
        template: templates/kubelet/daemonset-windows.yaml

  - it: global.podSecurityContext replaces the default on every Linux workload
    set:
      licenseKey: test
      cluster: test
      global:
        podSecurityContext:
          fsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 3000
        template: templates/controlplane/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 3000
        template: templates/kubelet/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 3000
        template: templates/ksm/deployment.yaml

  - it: podSecurityContext replaces the default and wins over global
    set:
      licenseKey: test
      cluster: test
      podSecurityContext:
        fsGroup: 2000
      global:
        podSecurityContext:
          fsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
        template: templates/controlplane/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
        template: templates/kubelet/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
        template: templates/ksm/deployment.yaml

  - it: user supplied podSecurityContext without fsGroup does not get the default merged in
    set:
      licenseKey: test
      cluster: test
      podSecurityContext:
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
        template: templates/controlplane/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
        template: templates/kubelet/daemonset.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
        template: templates/ksm/deployment.yaml
