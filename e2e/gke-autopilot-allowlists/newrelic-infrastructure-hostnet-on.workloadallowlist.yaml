# newrelic-infrastructure (nri-kubernetes) — node-scoped shape.
# Chart values that produce this workload:
#   provider: GKE_AUTOPILOT
#   privileged: true               # chart default; the agent runs privileged
#   gkeAutopilotAllowlist: true    # re-permits privileged on Autopilot (gates on privileged above)
#   kubelet.hostNetwork: true      # node-scoped network (host.net.* / NetworkSample)
# Host-namespace matching is exact; pairs with newrelic-infrastructure-hostnet-off.
apiVersion: auto.gke.io/v1
kind: WorkloadAllowlist
minGKEVersion: 1.32.2-gke.1652000
metadata:
    name: newrelic-infrastructure-hostnet-on
    annotations:
        autopilot.gke.io/no-connect: "true"
exemptions:
    - autogke-disallow-privilege
    - autogke-no-write-mode-hostpath
    - autogke-disallow-hostnamespaces
matchingCriteria:
    hostNetwork: true
    containers:
        - name: kubelet
          image: ^(.*/)?newrelic/nri-kubernetes$
          env:
            - name: ^NRI_KUBERNETES_.*$
          volumeMounts:
            - mountPath: /etc/newrelic-infra/nri-kubernetes.yml
              name: nri-kubernetes-config
              subPath: nri-kubernetes.yml
            - mountPath: /host/proc
              name: host-proc
              readOnly: true
        - name: agent
          image: ^(.*/)?newrelic/infrastructure-bundle$
          args:
            - newrelic-infra
          env:
            - name: ^NRIA_.*$
            - name: ^NRI_KUBERNETES_.*$
            - name: CLUSTER_NAME
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /etc/newrelic-infra.yml
              name: config
              subPath: newrelic-infra.yml
            - mountPath: /etc/newrelic-infra/integrations.d/
              name: nri-integrations-cfg-volume
            - mountPath: /dev
              name: dev
            - mountPath: /run/containerd/containerd.sock
              name: host-containerd-socket
            - mountPath: /var/run/docker.sock
              name: host-docker-socket
            - mountPath: /var/log
              name: log
            - mountPath: /host
              name: host-volume
              readOnly: true
            - mountPath: /var/db/newrelic-infra/data
              name: agent-tmpfs-data
            - mountPath: /var/db/newrelic-infra/user_data
              name: agent-tmpfs-user-data
            - mountPath: /tmp
              name: agent-tmpfs-tmp
    volumes:
        - hostPath:
            path: /dev
          name: dev
        - hostPath:
            path: /run/containerd/containerd.sock
          name: host-containerd-socket
        - hostPath:
            path: /var/run/docker.sock
          name: host-docker-socket
        - hostPath:
            path: /var/log
          name: log
        - hostPath:
            path: /
          name: host-volume
        - hostPath:
            path: /proc
          name: host-proc
        - name: agent-tmpfs-data
        - name: agent-tmpfs-user-data
        - name: agent-tmpfs-tmp
        - configMap: {}
          name: nri-kubernetes-config
        - configMap: {}
          name: config
        - configMap: {}
          name: nri-integrations-cfg-volume
