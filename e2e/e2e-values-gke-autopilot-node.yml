# GKE Autopilot e2e — NODE-SCOPED shape (hostNetwork ON).
# Pairs with allowlist CR newrelic-infrastructure-node-scoped-hostnet-on and asserts the
# node-scoped host layer (see test-specs-gke-autopilot.yml, scenario gke-ap-node).
# controlPlane stays disabled (hostNetwork:true, Warden-blocked, collects nothing on GKE). ksm is
# enabled to match the proven v2 config; note the chart only runs a KSM *scraper* (no bundled KSM),
# and the asserted k8s.node/pod/container metrics come from the kubelet, not KSM.
provider: GKE_AUTOPILOT
gkeAutopilotAllowlist: true

# Collect host process metrics so ProcessSample is emitted. No allowlist change needed — Google's
# generated CR is byte-identical with process metrics on (CLAUDE.md §5).
enableProcessMetrics: true

kubelet:
  enabled: true
  # Node-scoped shape: host network on -> host.net.*/NetworkSample report node interfaces.
  hostNetwork: true

ksm:
  enabled: true
controlPlane:
  enabled: false

# Image is controlled by the runner (run-gke-autopilot-e2e.sh), not this file:
#   released -> chart defaults (published newrelic/nri-kubernetes)
#   local    -> runner injects --set images.integration.registry/tag/pullPolicy for the dev build,
#               pushed to a path ending in `newrelic/nri-kubernetes` so the CR image regex matches.
# The agent container always stays the released infrastructure-bundle.
